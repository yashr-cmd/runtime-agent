plugins {
    id 'java'
}

group = 'transfinity'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Premain-Class'          : 'runtime.RuntimeAgent',
                'Agent-Class'            : 'runtime.RuntimeAgent',
                'Can-Redefine-Classes'   : 'true',
                'Can-Retransform-Classes': 'true'
        )
    }

    // Bundle ASM deps AND the nullifier.dll resource into the fat JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Explicitly include src/main/resources so the DLL is packaged
    from sourceSets.main.resources
}